<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drawing App</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .tool-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(3, auto);
            gap: 10px;
        }
    </style>
</head>
<body>
    <h1>Drawing App</h1>
    
    <div class="main-container">
        <div class="left-sidebar">
            <div class="shape-section">
                <span class="section-label">Shapes</span>
                <div class="shape-grid">
                    <button class="shape-btn" data-shape="rectangle" title="Rectangle">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                            <rect x="3" y="5" width="18" height="14" stroke="#e74c3c" stroke-width="2" rx="2"/>
                        </svg>
                    </button>
                    <button class="shape-btn" data-shape="circle" title="Circle">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                            <circle cx="12" cy="12" r="9" stroke="#9b59b6" stroke-width="2"/>
                        </svg>
                    </button>
                    <button class="shape-btn" data-shape="square" title="Square">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                            <rect x="4" y="4" width="16" height="16" stroke="#2ecc71" stroke-width="2" rx="2"/>
                        </svg>
                    </button>
                    <button class="shape-btn" data-shape="star" title="Star">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                            <path d="M12 2L15 9L22 9L16.5 14L18.5 22L12 17L5.5 22L7.5 14L2 9L9 9L12 2Z" stroke="#f39c12" stroke-width="2" stroke-linejoin="round"/>
                        </svg>
                    </button>
                    <button class="shape-btn arrow-btn" data-shape="arrow" title="Arrow">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                            <path d="M5 12H19M19 12L12 5M19 12L12 19" stroke="#3498db" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                    <button class="shape-btn line-btn" data-shape="line" title="Line">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                            <path d="M5 19L19 5" stroke="#27ae60" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                    </button>
                </div>
                
                <div class="dropdown-menus">
                    <div class="dropdown-menu arrow-menu">
                        <button class="dropdown-item" data-arrow="right">Right →</button>
                        <button class="dropdown-item" data-arrow="left">Left ←</button>
                        <button class="dropdown-item" data-arrow="up">Up ↑</button>
                        <button class="dropdown-item" data-arrow="down">Down ↓</button>
                    </div>
                    <div class="dropdown-menu line-menu">
                        <button class="dropdown-item" data-linetype="solid">Solid</button>
                        <button class="dropdown-item" data-linetype="dashed">Dashed ─ ─</button>
                        <button class="dropdown-item" data-linetype="dotted">Dotted · · ·</button>
                        <button class="dropdown-item" data-linetype="star">Star * * *</button>
                        <button class="dropdown-item" data-linetype="wave">Wave ~ ~</button>
                    </div>
                </div>
            </div>
            
            <div class="tool-section">
                <span class="section-label">Tools</span>
                <div class="tool-grid">
                    <button class="tool-btn active" data-tool="pencil" title="Pencil">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                            <path d="M17 3L21 7L7 21H3V17L17 3Z" stroke="#FFD700" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                    <button class="tool-btn" data-tool="pen" title="Pen">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                            <path d="M12 19L19 12L22 15L15 22L12 19Z" fill="#3498db"/>
                            <path d="M20 9L15 4L4 15L9 20L20 9Z" fill="#3498db"/>
                        </svg>
                    </button>
                    <button class="tool-btn" data-tool="brush" title="Brush">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                            <path d="M9.5 3C11.5 3 13 5 13 7C13 9 11.5 11 9.5 11C7.5 11 6 9 6 7C6 5 7.5 3 9.5 3Z" fill="#e74c3c"/>
                            <path d="M3 21L7 17L10 20L6 21L3 21Z" fill="#e74c3c"/>
                            <path d="M14 12L20 6" stroke="#e74c3c" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                    </button>
                    <button class="tool-btn" data-tool="eraser" title="Eraser">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                            <path d="M18 13L11 20H3L9 14" stroke="#9b59b6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M9 18L3 20H9L15 14" fill="#9b59b6"/>
                        </svg>
                    </button>
                    <button class="tool-btn" data-tool="fill" title="Fill">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                            <path d="M5 22L9 12L12 16L15 10L19 22H5Z" fill="#e74c3c"/>
                            <path d="M19 8C19 6 18 5 17 5C16 5 15 6 15 8C15 10 19 10 19 8Z" stroke="#e74c3c" stroke-width="2"/>
                            <path d="M19 8V17" stroke="#e74c3c" stroke-width="2"/>
                        </svg>
                    </button>
                    <button class="tool-btn" data-tool="select" title="Select">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                            <path d="M4 4L4 20L10 14L14 20L16 18L10 12L16 6L4 4Z" stroke="#2ecc71" stroke-width="2" stroke-linejoin="round"/>
                        </svg>
                    </button>
                </div>
            </div>
            
            <div class="option-section">
                <span class="section-label">Thickness</span>
                <input type="range" id="thicknessSlider" min="1" max="30" value="3">
                <span class="value-display" id="thicknessDisplay">3</span>
            </div>
            
            <div class="color-section">
                <span class="section-label">Color</span>
                <div class="color-grid">
                    <button class="color-preset active" data-color="#000000" style="background:#000000"></button>
                    <button class="color-preset" data-color="#ff0000" style="background:#ff0000"></button>
                    <button class="color-preset" data-color="#00ff00" style="background:#00ff00"></button>
                    <button class="color-preset" data-color="#0000ff" style="background:#0000ff"></button>
                    <button class="color-preset" data-color="#ffff00" style="background:#ffff00"></button>
                    <button class="color-preset" data-color="#ff00ff" style="background:#ff00ff"></button>
                    <button class="color-preset" data-color="#00ffff" style="background:#00ffff"></button>
                    <button class="color-preset" data-color="#ffffff" style="background:#ffffff; border: 1px solid #666"></button>
                </div>
            </div>
            
            <div class="action-section">
                <button class="action-btn" id="clearBtn" title="Clear Canvas">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
                        <path d="M3 6H21M8 6V4H16V6M19 6L18 19H6" stroke="#e74c3c" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    Clear
                </button>
                    <button class="tool-btn" data-tool="move" title="Move Selected" style="width: 100%; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 10px;">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                            <path d="M5 9L2 12L5 15M9 5L12 2L15 5M19 9L22 12L19 15M9 19L12 22L15 19" stroke="#9b59b6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        Move Selected
                    </button>
            </div>
        </div>

        <div class="canvas-section">
            <div class="canvas-wrapper" id="canvasWrapper">
                <div class="canvas-container" id="canvasContainer">
                    <canvas id="canvas" width="900" height="800"></canvas>
                </div>
            </div>
            
            <div class="bottom-bar">
                <div class="history-btns">
                    <button class="icon-btn" id="undoBtn" title="Undo">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                            <path d="M3 10H17C19.2 10 21 11.8 21 14C21 16.2 19.2 18 17 18H11" stroke="#3498db" stroke-width="2" stroke-linecap="round"/>
                            <path d="M7 6L3 10L7 14" stroke="#3498db" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                    </button>
                    <button class="icon-btn" id="redoBtn" title="Redo">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                            <path d="M21 10H7C4.8 10 3 11.8 3 14C3 16.2 4.8 18 7 18H13" stroke="#3498db" stroke-width="2" stroke-linecap="round"/>
                            <path d="M17 6L21 10L17 14" stroke="#3498db" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                    </button>
                    <button class="icon-btn" id="cropBtn" title="Crop">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                            <path d="M6 2V6H2M6 8H10V2M18 22V18H22M18 16H14V22" stroke="#f39c12" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                    </button>
                </div>
                
                <div class="zoom-btns">
                    <button class="icon-btn" id="zoomOut" title="Zoom Out">−</button>
                    <span class="zoom-display">100%</span>
                    <button class="icon-btn" id="zoomIn" title="Zoom In">+</button>
                </div>
                
                <div class="export-section">
                    <input type="number" id="exportWidth" value="900" min="1">
                    <span class="separator">×</span>
                    <input type="number" id="exportHeight" value="600" min="1">
                    <select id="formatSelect">
                        <option value="png">PNG</option>
                        <option value="jpeg">JPEG</option>
                        <option value="jpg">JPG</option>
                        <option value="svg">SVG</option>
                    </select>
                    <button class="download-btn" id="downloadBtn" title="Download">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                            <path d="M21 15V19C21 19.5 20.8 20 20.4 20.4C20 20.8 19.5 21 19 21H5C4.5 21 4 20.8 3.6 20.4C3.2 20 3 19.5 3 19V15" stroke="#27ae60" stroke-width="2" stroke-linecap="round"/>
                            <path d="M7 10L12 15L17 10M12 15V3" stroke="#27ae60" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="cursor-preview" id="cursorPreview">
        <span class="cursor-icon" id="cursorIcon"></span>
    </div>
    
    <div class="tooltip" id="tooltip"></div>
    
    <div class="crop-overlay" id="cropOverlay">
        <div class="crop-box" id="cropBox">
            <div class="crop-info" id="cropInfo">900 × 600</div>
            <div class="crop-handle nw"></div>
            <div class="crop-handle ne"></div>
            <div class="crop-handle sw"></div>
            <div class="crop-handle se"></div>
        </div>
        <div class="crop-actions">
            <button class="crop-btn cancel" id="cropCancel">Cancel</button>
            <button class="crop-btn apply" id="cropApply">Apply</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
